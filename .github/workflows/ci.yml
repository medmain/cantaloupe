name: CI
on: [push]
jobs:
  build:
    name: Test in JDK 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: information
        run: |
          pwd
          ls -al
          docker ps
          docker images
          docker-compose -f docker/test/docker-compose.yml down --rmi all --volumes --remove-orphans
          docker images

      - name: Cache Dependency
        uses: actions/cache@v4
        id: cache_m2_repository
        env:
          cache-name: cache-m2-repository
        with:
          path: ./docker/test/image_files/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('m2-repo.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache_m2_repository.outputs.cache-hit != 'true' }}
        name: load m2 repository
        continue-on-error: true
        run: ls -al docker/test/image_files/.m2

      - name: docker-compose up
        run: |
          docker-compose -f docker/test/docker-compose.yml -p cantaloupe up --build -d
          docker ps

      - name: extract repositories
        run: |
          docker ps
          docker cp cantaloupe_test_1:/home/cantaloupe/.m2/repository docker/test/image_files/.m2/
          ls -al docker/test/image_files/.m2/

