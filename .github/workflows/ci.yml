name: CI
on: [push]
jobs:
  build:
    name: Test in JDK 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build & run Docker container
        run: |
          docker-compose -f docker/test/docker-compose.yml -p cantaloupe up -d
          docker pull amazon/dynamodb-local
          docker run -d -p 8000:8000 amazon/dynamodb-local
          docker exec --user cantaloupe cantaloupe-test-1 /bin/sh -c "cd /home/cantaloupe; mvn clean test -Dtest=edu.illinois.library.cantaloupe.cache.S3CacheTest"
          docker exec --user cantaloupe cantaloupe-test-1 /bin/sh -c "cd /home/cantaloupe; mvn clean test -Dtest=edu.illinois.library.cantaloupe.cache.RedisCacheTest"
#          docker exec --user cantaloupe cantaloupe-test-1 /bin/sh -c "cd /home/cantaloupe; mvn clean test -Pfreedeps"
