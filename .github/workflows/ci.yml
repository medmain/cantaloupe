name: CI
on: [push]
jobs:
  build:
    name: Test in JDK 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Dependency
        uses: actions/cache@v4
        id: cache_m2_repository
        env:
          cache-name: cache-m2-repository
        with:
          path: ./docker/test/image_files/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('docker/test/image_files/.m2') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-
      - name: information
        run: |
          pwd
          ls -al
          ls -al docker/test/image_files/.m2
          ls -al docker/test/image_files/.m2/repository
          docker ps
          docker images
          docker-compose -f docker/test/docker-compose.yml down --rmi all --volumes --remove-orphans
          docker images

      - name: docker-compose up
        run: |
          docker-compose -f docker/test/docker-compose.yml -p cantaloupe up --build -d
          docker ps

      - run: sleep 3 # per seconds

        # FIXME I want to write it at the entrypoint.sh
      - name: boot
        run: |
          docker ps
          docker exec -d TestCantaloupe /bin/sh -c "redis-server /data/redis.conf" 

      - run: sleep 5

      - name: info
        run: |
          docker ps
          docker exec TestCantaloupe /bin/sh -c "ps aux |grep minio"
          docker exec TestCantaloupe /bin/sh -c "ps aux |grep redis"

      - name: setup maven
        run: |
          docker exec TestCantaloupe /bin/sh -c "mkdir -p /root/.m2/repository"
          docker cp docker/test/image_files/.m2/repository TestCantaloupe:/root/.m2/
          docker cp docker/test/image_files/.m2/settings.xml TestCantaloupe:/root/.m2/settings.xml
          docker cp ./pom.xml TestCantaloupe:pom.xml
          echo ".m2 finding"
          docker exec TestCantaloupe /bin/sh -c "mvn help:evaluate -Dexpression=settings.localRepository -q -DforceStdout"
          docker exec TestCantaloupe /bin/sh -c "mvn dependency:resolve"

      - name: test 'mvn clean test -Pfreedeps'
        run: |
          docker ps
          docker exec TestCantaloupe /bin/sh -c "mkdir -p /cantaloupe/.m2/repository"
          docker cp docker/test/image_files/.m2/repository TestCantaloupe:/cantaloupe/.m2/
          docker cp docker/test/image_files/.m2/settings.xml TestCantaloupe:/cantaloupe/.m2/settings.xml
          docker exec --user cantaloupe TestCantaloupe /bin/sh -c "mvn clean test -Pfreedeps"
#          docker exec TestCantaloupe /bin/sh -c "mvn clean test -Pfreedeps"

      - name: cache
        run: |
          docker cp TestCantaloupe:/root/.m2/repository docker/test/image_files/.m2/

